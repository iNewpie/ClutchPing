nifest.sig': 'aa67dc3c5cbb74fd0a2a107ecb4e3f5ab4c144de83a05b9ec701047d5e930d68'}\nctx=ssl.create_default_context(cadata=cert)\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n def redirect_request(self,*args): raise RuntimeError('Mirror redirect refused')\nopener=urllib.request.build_opener(urllib.request.ProxyHandler({}),urllib.request.HTTPSHandler(context=ctx),NoRedirect())\nfor name,digest in expected.items():\n path=pathlib.Path('assets')/name\n with opener.open('https://5.10.248.15:8444/clutchping/v2.11.24/'+name,timeout=20) as response,path.open('wb') as output:\n  total=0\n  while chunk:=response.read(1024*1024):\n   total+=len(chunk)\n   if total>256*1024*1024:raise RuntimeError('Asset size bound exceeded')\n   output.write(chunk)\n assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,name+' hash mismatch'\nm=json.loads(pathlib.Path('assets/update-manifest.json').read_bytes())\nassert m['Version']=='2.11.24' and m['File']=='ClutchPing.exe'\np=pathlib.Path('assets/ClutchPing.exe');assert m['Size']==p.stat().st_size and m['Sha256']==expected['ClutchPing.exe']\npathlib.Path('update-public.pem').write_text('-----BEGIN PUBLIC KEY-----\\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA812Q14autQUO+saLHK6o\\nwbcdLfeqYh5e8VzQ9H+Q3m09crZWQ/t80nzm/oiUHDmnuybDf82mgux5PM23Vwmz\\nFANhVQj36fkvZfCbYM6rKJ33sqvR3oeMP5lkVHXXS73dLLn+D8c285F2gj4Okt9n\\nOY1mwBUJExN+17mnH//O6JocQlAShR/FCTU9lwGDMmUSvQhMSGia7k57/P8VfTAe\\nbSpZyE29mDXg7SUeVNdXtciaK8JjVnA8X4Ylc6lt2lmwFTCZfByv0VJvetA4bnWW\\n5xgSJBqy+umZSBhCktDzdjeJBcN8yJ/ScowTGE9qcwkDTyhkWLS5c/hym1ilTpOY\\nxnEKMqBUqcRF6Z77RcmLr+BZ7MB2kTzz5NgHYzzhxYOjuS/mepRNhhi2UEPdPh9Y\\nLSkFhWNQfjMzBAzGOI1LRJ1UglMualULEoVe7LTShiuPK7RLcI6yz3B/52NYZdN6\\nn81QnIIO0+UPP4APKn3shYJ36hmGhdvGsTPHlbIJKmBtAgMBAAE=\\n-----END PUBLIC KEY-----')\npathlib.Path('release-notes.txt').write_text('ClutchPing 2.11.24 adds Minecraft > Type > Lunar Client \u2014 login only (Java direct).\\n\\nLunar launcher, installed helpers and account sign-in use the selected per-app tunnel. javaw.exe and java.exe stay direct so Minecraft server traffic avoids the proxy. The ordinary Lunar preset remains available.\\n\\nChoose the preset before connecting Minecraft. Switching into or out of login-only during connection setup or while Minecraft is active is blocked. Per app \u2014 WireSock is required; native UDP and TCP/UDP socket compatibility share the same rules.\\n\\nValidation: Windows release build, 19 Lunar routing checks, 41 SDK/lifecycle checks, 98 TCP policy checks and 8 updater transport checks passed. Signed payload verified; Defender found no threats. Live Lunar/Microsoft sign-in has not been exercised in this release test.\\n')\nprint('All four immutable staged assets match their reviewed SHA-256 digests.')\nPYFETCH\nopenssl dgst -sha256 -verify update-public.pem -signature assets/update-manifest.sig -sigopt rsa_padding_mode:pss -sigopt rsa_pss_saltlen:32 assets/update-manifest.json\n"
        },
        {
          "name": "Publish and verify stable GitHub release",
          "shell": "bash",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\nlatest=$(gh api repos/iNewpie/ClutchPing/releases/latest --jq .tag_name)\nLATEST=\"$latest\" python3 - <<'PYCHECK'\nimport os\nassert tuple(map(int,os.environ['LATEST'].removeprefix('v').split('.'))) < (2,11,24),'Refusing to replace a newer or existing stable release'\nPYCHECK\nif gh release view v2.11.24 --repo iNewpie/ClutchPing >/dev/null 2>&1; then\n echo 'This version already exists; immutable release creation stopped.' >&2\n exit 1\nfi\ngh release create v2.11.24 --repo iNewpie/ClutchPing --draft --title 'ClutchPing 2.11.24 - Lunar login only' --notes-file release-notes.txt\ngh release upload v2.11.24 --repo iNewpie/ClutchPing assets/ClutchPing.exe assets/ClutchPing.exe.sha256 assets/update-manifest.json assets/update-manifest.sig\ngh release download v2.11.24 --repo iNewpie/ClutchPing --dir verification\npython3 - <<'PYVERIFY'\nimport pathlib,hashlib\nfor source in pathlib.Path('assets').iterdir():\n assert hashlib.sha256(source.read_bytes()).digest()==hashlib.sha256((pathlib.Path('verification')/source.name).read_bytes()).digest(),source.name\nassert len(list(pathlib.Path('verification').iterdir()))==4\nprint('All four downloaded GitHub assets match the signed staged package.')\nPYVERIFY\ngh release edit v2.11.24 --repo iNewpie/ClutchPing --draft=false --prerelease=false --latest\ntest \"$(gh api repos/iNewpie/ClutchPing/releases/latest --jq .tag_name)\" = v2.11.24\n"
        }
      ]
    }
  }
}